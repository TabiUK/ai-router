name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  basic-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install base package
        run: python -m pip install -e .

      - name: Run hardware-independent tests
        run: |
          python tests/test_router_cold_start.py
          python tests/test_mock_backend_opt_in.py
          python tests/test_cuda_backend.py
          python tests/test_mps_backend.py
          python tests/test_openvino_gpu_routing.py
          python tests/test_cuda_routing_evidence.py
          python tests/test_openvino_gpu_routing_evidence.py
